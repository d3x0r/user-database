<script class="clientLoadWait" >
	let gsiClientLoadResolve = null;
	let gsiClientLoadedWait = null;
	function gsiClientLoaded(onLoad) {
		if( !gsiClientLoadedWait ) gsiClientLoadedWait = new Promise( (res,rej)=>{gsiClientLoadResolve=res})
		if( onLoad ) {
			if( window.google && window.google.accounts) {
				gsiClientLoadResolve(true);
				gsiClientLoadResolve = null;
			}
			for( let wait of window.d3x0r.popups.scriptPending ) {
				window.d3x0r.popups.onScriptDone( wait, ()=>{
					if( window.google && window.google.accounts) {
						gsiClientLoadResolve(true);
						gsiClientLoadResolve = null;
					}
				} )
			}
			return gsiClientLoadedWait;
		}
		return gsiClientLoadedWait;
	}
</script>
